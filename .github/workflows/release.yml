name: Publish release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build app packages 的运行 ID（运行页地址 runs/ 后的数字）；留空取最近一次仍有产物的手动构建
        type: string
        required: false
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve build run
        id: run
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            for id in $(gh api "repos/$GH_REPO/actions/workflows/build.yml/runs?event=workflow_dispatch&status=completed&per_page=20" --jq '.workflow_runs[].id'); do
              count="$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.expired | not)] | length')"
              if [ "$count" -gt 0 ]; then
                RUN_ID="$id"
                break
              fi
            done
          fi
          if [ -z "$RUN_ID" ]; then
            echo "没有找到仍有产物的手动构建"
            exit 1
          fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "number=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .run_number)" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .head_sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.run.outputs.sha }}
      - if: ${{ steps.run.outputs.id == github.run_id }}
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - if: ${{ steps.run.outputs.id != github.run_id }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Publish prerelease
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
          RUN_NUMBER: ${{ steps.run.outputs.number }}
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          if [ -z "$version" ]; then
            echo "pubspec.yaml 缺少版本号"
            exit 1
          fi
          editions=()
          compgen -G 'artifacts/hongguojian-*' > /dev/null && editions+=("红果鉴")
          compgen -G 'artifacts/zhenguojian-*' > /dev/null && editions+=("真果鉴")
          if [ "${#editions[@]}" -eq 0 ]; then
            echo "运行 $RUN_ID 没有可发布的产物"
            exit 1
          fi
          label="$(printf '%s / ' "${editions[@]}")"
          label="${label% / }"
          mkdir -p release
          for file in artifacts/*/*; do
            name="$(basename "$file")"
            if [ "$name" = "SHA256SUMS.txt" ]; then
              continue
            fi
            cp "$file" "release/${name//+/-}"
          done
          (cd release && sha256sum -- * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt release/
          tag="snapshot-${version//+/-}-run${RUN_NUMBER}"
          cat > notes.md <<EOF
          未完成集中验证的开发快照，仅供测试安装，不是正式发布版本。

          - 构建运行：https://github.com/${GH_REPO}/actions/runs/${RUN_ID}（#${RUN_NUMBER}）
          - 源码提交：${SHA}
          - Android：按设备架构选择 APK，常见手机使用 arm64-v8a；未配置固定签名 Secrets 时为预览签名，与其他构建的安装包不能相互覆盖升级。
          - iOS：未签名 .app 压缩包，需自行签名后侧载，不能直接安装。
          - 通过镜像或加速地址下载后，用 SHA256SUMS.txt 校验文件。
          EOF
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --target "$SHA" --prerelease \
              --title "$label $version 开发快照（构建 #$RUN_NUMBER）" --notes-file notes.md
          fi
          url="$(gh release view "$tag" --json url --jq .url)"
          echo "已发布：$url"
          {
            echo "### $label $version 开发快照"
            echo
            echo "$url"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
